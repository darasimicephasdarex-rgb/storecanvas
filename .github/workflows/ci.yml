name: StoreCanvas validation
on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax
        run: npm run check
      - name: Run core tests
        run: npm test
      - name: Check frontend and theme assets
        run: |
          node --check editor/app.js
          node --check editor/exporter.js
          node --check editor/runtime.js
          node --check engine/theme.mjs
          node --check engine/zip.mjs
          node --check shopify/assets/storecanvas-freeform.js
          test -s shopify/sections/storecanvas-freeform.liquid
          test -s shopify/assets/storecanvas-freeform.css
