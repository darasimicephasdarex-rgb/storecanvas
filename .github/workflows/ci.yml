name: StoreCanvas validation
on:
  push:
    branches: [main, 'develop/**', 'feature/**']
  pull_request:
    branches: [main, 'develop/**']
permissions:
  contents: read
jobs:
  core-and-theme-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and reproducible runtime
        run: npm run check
      - name: All core, commerce and export tests
        run: npm test
      - name: Generate independent Shopify theme
        run: npm run build:theme
      - name: Validate generated theme structure and hashes
        run: npm run check:theme
      - name: Official Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: ./dist/shopify-theme
          flags: --fail-level error
      - name: Upload generated QA theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: storecanvas-theme-qa
          path: dist/storecanvas-theme.zip
          if-no-files-found: error
          retention-days: 14
      - name: Validate storefront JavaScript source
        run: |
          node --check editor/app.js
          node --check editor/exporter.js
          node --check shopify/assets/storecanvas-freeform.js
          node --check editor/runtime.js
          node --check engine/commerce.mjs
          node --check engine/theme.mjs
